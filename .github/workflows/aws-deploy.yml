name: Deploy Website to AWS Amplify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::767397664253:role/GithubActionDeployRole
          aws-region: eu-north-1

      - name: Package Website
        run: |
          cd devops-portfolio
          zip -r ../website.zip . -x ".git/*"

      - name: Create Amplify Deployment
        id: deployment
        run: |
          RESPONSE=$(aws amplify create-deployment \
            --app-id d37b30nhr9899r \
            --branch-name main \
            --output json)

          echo "$RESPONSE" > deployment.json

          echo "job_id=$(jq -r '.jobId // empty' deployment.json)" >> "$GITHUB_OUTPUT"
          echo "upload_url=$(jq -r '.zipUploadUrl' deployment.json)" >> "$GITHUB_OUTPUT"

      - name: Upload Website ZIP
        run: |
          curl --fail --silent --show-error \
            -T website.zip \
            "${{ steps.deployment.outputs.upload_url }}"

      - name: Start Amplify Deployment
        run: |
          aws amplify start-deployment \
            --app-id d37b30nhr9899r \
            --branch-name main \
            --job-id "${{ steps.deployment.outputs.job_id }}"
